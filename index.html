<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survival Companion v6.14</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #ff4757;
            --text-color: #f1f1f1;
            --success-color: #2ecc71;
            --highlight-color: #f1c40f;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        h1, h2, h3 { 
            text-align: center; 
            margin: 0 0 6px 0; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            font-size: 15px;
        }

        .app-container {
            width: 100%;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            padding: 10px;
            position: relative;
        }

        /* SETUP SCREEN */
        #setup-screen {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #aaa;
        }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            font-size: 15px;
        }

        .custom-settings-box {
            background: #383838;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .custom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #fff;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .player-setup-card {
            background: #383838;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .char-select-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #444;
            border: 2px solid var(--highlight-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
        }

        .char-select-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        .char-select-preview .icon-char { font-size: 22px; }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .btn:active { transform: scale(0.98); background: #e04050; }

        /* GAME SCREEN */
        #game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 8px;
            min-height: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }

        .top-bar-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-icon-menu {
            background: #444;
            border: 1px solid #555;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-icon-menu:active { background: #555; }

        /* HUD */
        .hud {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #222;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid #444;
        }

        .hud-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .hud-value {
            font-size: 32px;
            font-weight: 900;
            line-height: 1;
        }

        .medikit-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .btn-mini {
            width: 30px;
            height: 30px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        /* SURVIVORS PANEL */
        .survivors-container {
            background: #222;
            padding: 6px 8px;
            border-radius: 10px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            min-height: 0;
            max-height: 140px;
            flex: 1.3;
        }

        .survivors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
            gap: 6px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .survivor-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .survivor-card.dead {
            opacity: 0.15;
            filter: grayscale(100%);
        }

        .survivor-avatar {
            font-size: 26px;
            background: #444;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 3px;
            border: 2px solid transparent;
        }

        .survivor-card.player .survivor-avatar {
            border-color: var(--highlight-color);
            box-shadow: 0 0 8px rgba(241, 196, 15, 0.6);
        }

        .survivor-name {
            font-weight: bold;
            color: #fff;
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
            width: 100%;
        }

        /* ÄUSSERE ZOMBIE-DISPLAY-BOX (GANZE BREITE) */
        .zombie-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #222;
            border-radius: 12px;
            border: 1px solid #444;
            flex: 1.9;
            justify-content: space-between;
            min-height: 0;
            position: relative;
            overflow: hidden;
            padding: 8px 10px 10px 10px;
        }

        /* GANZ OBEN ANGEHEFTETE DISTANZ-LEISTE */
        .distance-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        .distance-progress-bg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: var(--success-color);
            opacity: 0.65;
            transition: width 0.2s ease-out, background-color 0.3s ease;
            z-index: 1;
        }

        .distance-hud-inline {
            position: relative;
            z-index: 2;
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            letter-spacing: 1px;
        }

        /* INHALTS-WRAPPER UNTER DER ÄUSSEREN TOP-LEISTE */
        .zombie-content-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            margin-top: 28px;
        }

        /* INNERE ZOMBIE BOX */
        .zombie-box {
            width: 100%;
            max-width: 260px;
            height: 90px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .zombie-box.beisser { background-color: #553311; color: #fff; }
        .zombie-box.sprinter { background-color: #551111; color: #fff; }
        .zombie-box.bomber { background-color: #111; color: #fff; border: 3px solid #555; }

        .zombie-icon { font-size: 36px; line-height: 1; }
        
        .skulls {
            position: absolute;
            top: 4px;
            right: 8px;
            font-size: 11px;
            display: flex;
            gap: 2px;
        }

        .zombie-title {
            margin-top: 2px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .health-bar-container {
            width: 100%;
            max-width: 260px;
            background: #444;
            height: 12px;
            border-radius: 6px;
            margin-top: 5px;
            overflow: hidden;
            border: 1px solid #555;
        }

        .health-bar-fill {
            height: 100%;
            background: var(--success-color);
            width: 100%;
            transition: width 0.2s ease, background-color 0.2s;
        }

        .health-bar-container.wounded .health-bar-fill {
            background: #e67e22;
        }

        /* ACTION BUTTONS */
        .action-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-damage {
            flex: 1;
            padding: 16px 10px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-damage-full { background: #c0392b; }
        .btn-damage:active { transform: scale(0.96); }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            border: 1px solid #555;
        }

        .modal-header {
            padding: 12px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 15px;
            text-align: center;
            font-size: 16px;
        }

        .modal-list {
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: #383838;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .modal-item.selected {
            border-color: var(--highlight-color);
            background: #444;
        }

        .modal-item .icon-char { font-size: 26px; }

        .modal-actions {
            display: flex;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid #444;
        }

        .btn-modal {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-confirm { background: var(--accent-color); color: white; }
        .btn-cancel { background: #555; color: white; }

        .hidden { display: none !important; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #222; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <h2>Spiel Setup</h2>
        
        <div class="form-group">
            <label for="player-count">Anzahl der Spieler:</label>
            <select id="player-count" onchange="generatePlayerSetup()">
                <option value="1">1 Spieler</option>
                <option value="2">2 Spieler</option>
                <option value="3">3 Spieler</option>
                <option value="4">4 Spieler</option>
            </select>
        </div>

        <div id="players-container"></div>

        <div class="form-group">
            <label for="difficulty">Spielmodus / Schwierigkeit:</label>
            <select id="difficulty" onchange="toggleCustomSettings()">
                <option value="easy">Einfach (Verhältnis 4:3)</option>
                <option value="medium" selected>Mittel (Verhältnis 4:2)</option>
                <option value="hard">Schwer (Verhältnis 4:1)</option>
                <option value="custom">⚙️ Benutzerdefiniert</option>
            </select>
        </div>

        <div class="form-group">
            <label for="zombie-speed">Zombiegeschwindigkeit:</label>
            <select id="zombie-speed">
                <option value="slow">Langsam</option>
                <option value="medium" selected>Mittel</option>
                <option value="fast">Schnell</option>
            </select>
        </div>

        <!-- BENUTZERDEFINIERTE EINSTELLUNGEN -->
        <div id="custom-settings-box" class="custom-settings-box hidden">
            <label style="color: var(--highlight-color); margin-bottom: 2px;">Benutzerdefinierte Anzahl:</label>
            <div class="custom-grid">
                <div class="form-group">
                    <label>Beißer:</label>
                    <input type="number" id="custom-beisser" value="10" min="0" max="50">
                </div>
                <div class="form-group">
                    <label>Sprinter:</label>
                    <input type="number" id="custom-sprinter" value="5" min="0" max="30">
                </div>
                <div class="form-group">
                    <label>Bomber:</label>
                    <input type="number" id="custom-bomber" value="2" min="0" max="20">
                </div>
                <div class="form-group">
                    <label>Überlebende (NPCs):</label>
                    <input type="number" id="custom-survivors" value="8" min="0" max="50">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="enable-distance" checked>
                <span>Aktive Zombie-Distanz & Annäherung aktivieren</span>
            </label>
        </div>

        <button class="btn" style="margin-top: auto;" onclick="startGame()">Spiel Starten</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden">
        <div class="top-bar">
            <span style="font-weight: bold; font-size: 13px; color: #aaa;">ZOMBIE COMPANION</span>
            <div class="top-bar-buttons">
                <button class="btn-icon-menu" id="btn-pause" onclick="togglePause()">⏸️ Pause</button>
                <button class="btn-icon-menu" onclick="promptQuit()">⚙️ Menü</button>
            </div>
        </div>

        <div class="hud">
            <div class="hud-stat" style="color: #e74c3c;">
                <span class="hud-label">🧟 Zombies</span>
                <span class="hud-value" id="zombie-count">0</span>
            </div>
            <div class="hud-stat" style="color: #3498db;">
                <span class="hud-label">🧑 Überlebende</span>
                <span class="hud-value" id="survivor-count">0</span>
            </div>
            <div class="hud-stat" style="color: #2ecc71;">
                <span class="hud-label">💉 Medikits</span>
                <div class="medikit-controls">
                    <button class="btn-mini" onclick="updateMedikit(-1)">-</button>
                    <span class="hud-value" id="medikit-count">0</span>
                    <button class="btn-mini" onclick="updateMedikit(1)">+</button>
                </div>
            </div>
        </div>

        <div class="survivors-container">
            <h3>Überlebende</h3>
            <div class="survivors-grid" id="survivors-grid"></div>
        </div>

        <!-- ÄUSSERE ZOMBIE-DISPLAY-BOX -->
        <div class="zombie-display">
            <!-- Distanz-Leiste -->
            <div id="distance-top-bar" class="distance-top-bar">
                <div id="distance-bar-bg" class="distance-progress-bg"></div>
                <div id="distance-container-inline" class="distance-hud-inline">📍 <span id="distance-text">50m</span></div>
            </div>

            <!-- Innerer Bereich für Zombie und HP -->
            <div class="zombie-content-wrapper">
                <div id="zombie-box" class="zombie-box">
                    <div id="skulls-container" class="skulls"></div>
                    <div class="zombie-icon">🧟</div>
                    <strong id="zombie-name" class="zombie-title">-</strong>
                </div>
                
                <div id="hb-container" class="health-bar-container">
                    <div id="health-bar" class="health-bar-fill"></div>
                </div>
                <span id="health-text" style="font-size: 11px; margin-top: 3px; font-weight: bold;">0 / 0 Leben</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-damage" onclick="dealDamage(0.5)">Verwunden<br><span style="font-size:12px; font-weight:normal;">(-0.5)</span></button>
            <button class="btn-damage btn-damage-full" onclick="dealDamage(1.0)">Treffer<br><span style="font-size:12px; font-weight:normal;">(-1.0)</span></button>
        </div>
    </div>
</div>

<!-- CHARACTER SELECTION MODAL -->
<div id="char-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Charakter Wählen</h3>
        </div>
        <div class="modal-list" id="modal-char-list"></div>
    </div>
</div>

<!-- QUIT CONFIRMATION MODAL -->
<div id="quit-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Spiel Beenden?</h3>
        </div>
        <div class="modal-body">
            Möchtest du das Spiel abbrechen und zum Hauptmenü zurückkehren? Der Fortschritt geht verloren.
        </div>
        <div class="modal-actions">
            <button class="btn-modal btn-confirm" onclick="confirmQuit()">Ja, Beenden</button>
            <button class="btn-modal btn-cancel" onclick="closeQuitModal()">Abbrechen</button>
        </div>
    </div>
</div>

<!-- GAME END MODAL -->
<div id="end-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="end-modal-title">SPIEL ENDE</h3>
        </div>
        <div class="modal-body" id="end-modal-text"></div>
        <div class="modal-actions">
            <button class="btn-modal btn-confirm" onclick="resetToSetup()">Zum Hauptmenü</button>
        </div>
    </div>
</div>

<script>
    const availableCharacters = [
        { icon: '👨‍🌾', label: 'Farmer (M)' },
        { icon: '👨‍🎤', label: 'Rockstar (M)' },
        { icon: '👨‍⚕️', label: 'Arzt (M)' },
        { icon: '👮‍♂️', label: 'Polizist (M)' },
        { icon: '🧑‍🚒', label: 'Feuerwehrmann' },
        { icon: '👩‍🌾', label: 'Farmerin (W)' },
        { icon: '👩‍🎤', label: 'Rockstarin (W)' },
        { icon: '👩‍⚕️', label: 'Ärztin (W)' },
        { icon: '👮‍♀️', label: 'Polizistin (W)' },
        { icon: '👩‍🚒', label: 'Feuerwehrfrau' }
    ];

    const genericMALE = '👨';
    const genericFEMALE = '👩';

    let selectedPlayerIndexForModal = null;
    let playersData = [];
    let zombiesQueue = [];
    let currentZombie = null;
    let medikits = 0;
    let isGameOver = false;
    
    // Distance & Timer State
    let distanceEnabled = true;
    let isPaused = false;
    let timerInterval = null;
    let totalZombieTime = 25; 
    let remainingZombieTime = 25;
    let speedModifier = 1.0;

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generatePlayerSetup() {
        const count = parseInt(document.getElementById('player-count').value);
        const container = document.getElementById('players-container');
        container.innerHTML = '';

        for (let i = 0; i < count; i++) {
            const defaultChar = availableCharacters[i % availableCharacters.length];
            const div = document.createElement('div');
            div.className = 'player-setup-card';
            div.innerHTML = `
                <label>Spieler ${i + 1} Name:</label>
                <input type="text" id="player-name-${i}" value="Spieler ${i + 1}" maxlength="12">
                <label>Charakter:</label>
                <div class="char-select-btn" onclick="openCharModal(${i})">
                    <div class="char-select-preview" id="preview-${i}">
                        <span class="icon-char">${defaultChar.icon}</span>
                        <span>${defaultChar.label}</span>
                    </div>
                    <span>Ändern ⚙️</span>
                </div>
                <input type="hidden" id="player-icon-${i}" value="${defaultChar.icon}">
            `;
            container.appendChild(div);
        }
    }

    function toggleCustomSettings() {
        const diff = document.getElementById('difficulty').value;
        const customBox = document.getElementById('custom-settings-box');
        if (diff === 'custom') {
            customBox.classList.remove('hidden');
        } else {
            customBox.classList.add('hidden');
        }
    }

    function openCharModal(playerIndex) {
        selectedPlayerIndexForModal = playerIndex;
        const currentIcon = document.getElementById(`player-icon-${playerIndex}`).value;
        const listContainer = document.getElementById('modal-char-list');
        listContainer.innerHTML = '';

        availableCharacters.forEach(char => {
            const isSelected = char.icon === currentIcon;
            const item = document.createElement('div');
            item.className = `modal-item ${isSelected ? 'selected' : ''}`;
            item.innerHTML = `
                <span class="icon-char">${char.icon}</span>
                <span class="icon-label">${char.label}</span>
            `;
            item.onclick = () => selectCharacter(char);
            listContainer.appendChild(item);
        });

        document.getElementById('char-modal').classList.remove('hidden');
    }

    function selectCharacter(char) {
        if (selectedPlayerIndexForModal !== null) {
            document.getElementById(`player-icon-${selectedPlayerIndexForModal}`).value = char.icon;
            document.getElementById(`preview-${selectedPlayerIndexForModal}`).innerHTML = `
                <span class="icon-char">${char.icon}</span>
                <span>${char.label}</span>
            `;
        }
        document.getElementById('char-modal').classList.add('hidden');
    }

    function startGame() {
        isGameOver = false;
        isPaused = false;
        document.getElementById('btn-pause').innerText = "⏸️ Pause";
        
        distanceEnabled = document.getElementById('enable-distance').checked;

        const speedSetting = document.getElementById('zombie-speed').value;
        if (speedSetting === 'slow') speedModifier = 2.0;
        else if (speedSetting === 'medium') speedModifier = 1.0;
        else if (speedSetting === 'fast') speedModifier = 0.5;

        const pCount = parseInt(document.getElementById('player-count').value);
        playersData = [];
        for (let i = 0; i < pCount; i++) {
            playersData.push({
                name: document.getElementById(`player-name-${i}`).value || `Spieler ${i + 1}`,
                icon: document.getElementById(`player-icon-${i}`).value
            });
        }

        const diff = document.getElementById('difficulty').value;
        let beisserCount, sprinterCount, bomberCount, npcSurvivorCount;

        if (diff === 'custom') {
            beisserCount = parseInt(document.getElementById('custom-beisser').value) || 0;
            sprinterCount = parseInt(document.getElementById('custom-sprinter').value) || 0;
            bomberCount = parseInt(document.getElementById('custom-bomber').value) || 0;
            npcSurvivorCount = parseInt(document.getElementById('custom-survivors').value) || 0;
        } else {
            let bMin, bMax, sMin, sMax, boMin, boMax, survMin, survMax;

            if (diff === 'easy') {
                bMin = 9; bMax = 14; sMin = 4; sMax = 6; boMin = 2; boMax = 3; survMin = 11; survMax = 17;
            } else if (diff === 'medium') {
                bMin = 14; bMax = 19; sMin = 6; sMax = 9; boMin = 3; boMax = 5; survMin = 9; survMax = 13;
            } else { // hard
                bMin = 20; bMax = 28; sMin = 8; sMax = 12; boMin = 5; boMax = 7; survMin = 5; survMax = 9;
            }

            beisserCount = getRandomInt(bMin, bMax);
            sprinterCount = getRandomInt(sMin, sMax);
            bomberCount = getRandomInt(boMin, boMax);
            npcSurvivorCount = getRandomInt(survMin, survMax);
        }

        zombiesQueue = [];
        for (let i = 0; i < beisserCount; i++) zombiesQueue.push({ name: 'Beißer', maxHp: 1, currentHp: 1, skulls: 1, class: 'beisser' });
        for (let i = 0; i < sprinterCount; i++) zombiesQueue.push({ name: 'Sprinter', maxHp: 2, currentHp: 2, skulls: 2, class: 'sprinter' });
        for (let i = 0; i < bomberCount; i++) zombiesQueue.push({ name: 'Bomber', maxHp: 3, currentHp: 3, skulls: 3, class: 'bomber' });

        zombiesQueue.sort(() => Math.random() - 0.5);

        const grid = document.getElementById('survivors-grid');
        grid.innerHTML = '';
        
        const totalInitialSurvivors = playersData.length + npcSurvivorCount;
        document.getElementById('survivor-count').innerText = totalInitialSurvivors;

        playersData.forEach(p => {
            grid.appendChild(createSurvivorCard(p.icon, p.name, true));
        });

        for (let i = 0; i < npcSurvivorCount; i++) {
            const genericIcon = Math.random() > 0.5 ? genericMALE : genericFEMALE;
            grid.appendChild(createSurvivorCard(genericIcon, 'Überlebender', false));
        }

        medikits = 0;
        document.getElementById('medikit-count').innerText = medikits;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        const distanceTopBar = document.getElementById('distance-top-bar');
        if (distanceEnabled) {
            distanceTopBar.classList.remove('hidden');
        } else {
            distanceTopBar.classList.add('hidden');
        }

        nextZombie();
    }

    function createSurvivorCard(icon, name, isPlayer) {
        const card = document.createElement('div');
        card.className = `survivor-card ${isPlayer ? 'player' : ''}`;
        card.innerHTML = `
            <div class="survivor-avatar">${icon}</div>
            <span class="survivor-name">${name}</span>
        `;
        card.onclick = function() {
            if (isGameOver) return;
            this.classList.toggle('dead');
            updateSurvivorCount();
        };
        return card;
    }

    function updateSurvivorCount() {
        const total = document.querySelectorAll('.survivor-card').length;
        const dead = document.querySelectorAll('.survivor-card.dead').length;
        const alive = total - dead;
        document.getElementById('survivor-count').innerText = alive;

        if (alive === 0 && !isGameOver) {
            triggerGameOver(false);
        }
    }

    function killSingleSurvivor() {
        const aliveCards = Array.from(document.querySelectorAll('.survivor-card:not(.dead)'));
        if (aliveCards.length > 0) {
            aliveCards[aliveCards.length - 1].classList.add('dead');
            updateSurvivorCount();
        }
    }

    function killDoubleSurvivor() {
        const aliveCards = Array.from(document.querySelectorAll('.survivor-card:not(.dead)'));
        if (aliveCards.length > 0) {
            aliveCards[aliveCards.length - 1].classList.add('dead');
        }
        const remainingAliveCards = Array.from(document.querySelectorAll('.survivor-card:not(.dead)'));
        if (remainingAliveCards.length > 0) {
            remainingAliveCards[remainingAliveCards.length - 1].classList.add('dead');
        }
        updateSurvivorCount();
    }

    function nextZombie() {
        stopTimer();
        const skullsContainer = document.getElementById('skulls-container');
        const hbContainer = document.getElementById('hb-container');

        if (zombiesQueue.length === 0) {
            currentZombie = null;
            document.getElementById('zombie-name').innerText = "ALLE BESIEGT";
            document.getElementById('zombie-box').className = 'zombie-box';
            document.getElementById('zombie-box').style.background = '#2ecc71';
            document.getElementById('distance-top-bar').classList.add('hidden');
            skullsContainer.innerHTML = '🎉';
            document.getElementById('health-bar').style.width = '0%';
            document.getElementById('health-text').innerText = 'ENDE';
            document.getElementById('zombie-count').innerText = 0;
            hbContainer.classList.remove('wounded');
            
            if (!isGameOver) {
                triggerGameOver(true);
            }
            return;
        }

        currentZombie = zombiesQueue.shift();
        document.getElementById('zombie-count').innerText = zombiesQueue.length + 1;
        
        if (distanceEnabled) {
            document.getElementById('distance-top-bar').classList.remove('hidden');
            const diff = document.getElementById('difficulty').value;
            let baseTime = 25;
            
            if (currentZombie.class === 'beisser') {
                baseTime = (diff === 'easy') ? 25 : 15;
            } else if (currentZombie.class === 'sprinter') {
                baseTime = (diff === 'easy') ? 15 : 7.5;
            } else if (currentZombie.class === 'bomber') {
                baseTime = (diff === 'easy') ? 80 : 45;
            }
            
            totalZombieTime = baseTime * speedModifier;
            remainingZombieTime = totalZombieTime;
            startTimer();
        }

        renderZombie();
    }

    function startTimer() {
        stopTimer();
        if (!distanceEnabled || isGameOver || isPaused) return;

        timerInterval = setInterval(() => {
            if (isPaused || isGameOver) return;
            remainingZombieTime -= 0.5;
            updateDistanceDisplay();

            if (remainingZombieTime <= 0) {
                stopTimer();
                if (currentZombie && currentZombie.class === 'bomber') {
                    killDoubleSurvivor();
                } else {
                    killSingleSurvivor();
                }
                
                if (!isGameOver) {
                    nextZombie();
                }
            }
        }, 500);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function togglePause() {
        if (isGameOver || !distanceEnabled) return;
        isPaused = !isPaused;
        const pauseBtn = document.getElementById('btn-pause');
        
        if (isPaused) {
            stopTimer();
            pauseBtn.innerText = "▶️ Weiter";
            pauseBtn.style.background = "#2ecc71";
        } else {
            startTimer();
            pauseBtn.innerText = "⏸️ Pause";
            pauseBtn.style.background = "#444";
        }
    }

    function updateDistanceDisplay() {
        if (!distanceEnabled || !currentZombie) return;
        
        let maxDist = 50;
        if (currentZombie.class === 'sprinter') maxDist = 30;
        if (currentZombie.class === 'bomber') maxDist = (document.getElementById('difficulty').value === 'easy') ? 160 : 90;

        const currentDist = Math.max(0, Math.round((remainingZombieTime / totalZombieTime) * maxDist));
        document.getElementById('distance-text').innerText = `${currentDist}m`;

        const timePercentage = Math.max(0, (remainingZombieTime / totalZombieTime) * 100);
        const bgBar = document.getElementById('distance-bar-bg');
        bgBar.style.width = `${timePercentage}%`;

        if (timePercentage > 50) {
            bgBar.style.background = '#27ae60';
        } else if (timePercentage > 20) {
            bgBar.style.background = '#d35400';
        } else {
            bgBar.style.background = '#c0392b';
        }
    }

    /* NEU: Wirft den Zombie bei Treffer/Verwundung um 5 Meter zurück */
    function knockbackZombie() {
        if (!distanceEnabled || !currentZombie) return;

        let maxDist = 50;
        if (currentZombie.class === 'sprinter') maxDist = 30;
        if (currentZombie.class === 'bomber') maxDist = (document.getElementById('difficulty').value === 'easy') ? 160 : 90;

        // Berechne, wie viel Zeit (in Sekunden) 5 Metern entspricht
        const timePerMeter = totalZombieTime / maxDist;
        const timeBonus = 5 * timePerMeter;

        // Addiere die Zeit dazu (maximal bis zur vollen Startzeit)
        remainingZombieTime = Math.min(totalZombieTime, remainingZombieTime + timeBonus);
        updateDistanceDisplay();
    }

    function renderZombie() {
        const box = document.getElementById('zombie-box');
        const hbContainer = document.getElementById('hb-container');
        box.className = `zombie-box ${currentZombie.class}`;
        box.style.background = '';
        
        document.getElementById('zombie-name').innerText = currentZombie.name;

        const skullsContainer = document.getElementById('skulls-container');
        skullsContainer.innerHTML = '💀'.repeat(currentZombie.skulls);

        if (currentZombie.currentHp > 0 && currentZombie.currentHp % 1 !== 0) {
            hbContainer.classList.add('wounded');
        } else {
            hbContainer.classList.remove('wounded');
        }

        const pct = (currentZombie.currentHp / currentZombie.maxHp) * 100;
        document.getElementById('health-bar').style.width = `${Math.max(0, pct)}%`;
        document.getElementById('health-text').innerText = `${currentZombie.currentHp.toFixed(1).replace('.0','')} / ${currentZombie.maxHp} Leben`;

        if (distanceEnabled) {
            updateDistanceDisplay();
        }
    }

    function dealDamage(amount) {
        if (!currentZombie || isGameOver || isPaused) return;

        currentZombie.currentHp -= amount;
        
        // Zombie visuell kurz pulsieren lassen
        const box = document.getElementById('zombie-box');
        box.style.transform = 'scale(1.05)';
        setTimeout(() => box.style.transform = 'scale(1)', 100);

        // 5 Meter zurückwerfen bei jeder Aktion
        knockbackZombie();

        if (currentZombie.currentHp <= 0) {
            currentZombie.currentHp = 0;
            renderZombie();
            setTimeout(nextZombie, 300);
        } else {
            renderZombie();
        }
    }

    function updateMedikit(change) {
        medikits = Math.max(0, medikits + change);
        document.getElementById('medikit-count').innerText = medikits;
    }

    function triggerGameOver(victory) {
        isGameOver = true;
        stopTimer();
        const modal = document.getElementById('end-modal');
        const title = document.getElementById('end-modal-title');
        const text = document.getElementById('end-modal-text');

        if (victory) {
            title.innerText = "SIEG!";
            title.style.color = "#2ecc71";
            text.innerText = "Ihr habt es überlebt! Alle Zombies wurden erfolgreich vernichtet.";
        } else {
            title.innerText = "GAME OVER";
            title.style.color = "#e74c3c";
            text.innerText = "Ihr habt es nicht geschafft... Alle Überlebenden sind gefallen.";
        }

        modal.classList.remove('hidden');
    }

    function promptQuit() {
        stopTimer();
        document.getElementById('quit-modal').classList.remove('hidden');
    }

    function closeQuitModal() {
        if (!isPaused && !isGameOver) startTimer();
        document.getElementById('quit-modal').classList.add('hidden');
    }

    function confirmQuit() {
        closeQuitModal();
        resetToSetup();
    }

    function resetToSetup() {
        stopTimer();
        document.getElementById('end-modal').classList.add('hidden');
        document.getElementById('quit-modal').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
    }

    generatePlayerSetup();
</script>
</body>
</html>
